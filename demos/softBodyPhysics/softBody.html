	<script type="application/javascript">
		
		
		function program() {
		    
		    title("SoftBodyRocket");
		    size(600, 600);
		    
		    // All code goes here
			
			
			var debugText=!false;
			
			var cam=[0,0];
			var pcam=[0,0];
			var camZ=0.2;
			
			var pressure=1;
			
			var totalChecks=0;
			
			
			
			//math
			//{
			var vectorClass=function(x,y){
			    this.x=x;
			    this.y=y;
			};
			vectorClass.prototype.normalize=function(){
			    var l=sqrt(sq(this.x)+sq(this.y));
			    if(l>0){
			        this.x/=l;
			        this.y/=l;
			    }
			};
			vectorClass.prototype.mult=function(inputX){
			    this.x*=inputX;
			    this.y*=inputX;
			};
			
			var toCamPos=function(x,y){
			    var towardsMid=new vectorClass(width/2-x+cam[0],height/2-y+cam[1]);
			    return [width/2-towardsMid.x*camZ,height/2-towardsMid.y*camZ];
			};
			
			var determinant2x2=function(input){
			    var output=input[0][0]*input[1][1]-input[0][1]*input[1][0];
			    
			    return output;  
			};
			
			var determinant3x3=function(input){
			    var output=0;
			    var aM=[
			        [input[1][1],input[1][2]],
			        [input[2][1],input[2][2]],
			        ];
			    var bM=[
			        [input[1][0],input[1][2]],
			        [input[2][0],input[2][2]],
			        ];
			    var cM=[
			        [input[1][0],input[1][1]],
			        [input[2][0],input[2][1]],
			        ];
			    var output=input[0][0]*determinant2x2(aM)-input[0][1]*determinant2x2(bM)+input[0][2]*determinant2x2(cM);
			    
			  
			    return output;  
			};
			    
			var areaOfTriangle=function(input){
			    var inputCorrectMatrix=[
			        [input[0][0],input[0][1],1],
			        [input[1][0],input[1][1],1],
			        [input[2][0],input[2][1],1]
			        ];
			    return abs(determinant3x3(inputCorrectMatrix))/2;
			};
			
			var angleBetweenPoints=function(center,p1,p2){
			    var m1=sqrt(sq(center[0]-p1[0])+sq(center[1]-p1[1]));
			    var m2=sqrt(sq(center[0]-p2[0])+sq(center[1]-p2[1]));
			    var n=(p1[0]-center[0])*(p2[0]-center[0])+(p1[1]-center[1])*(p2[1]-center[1]);
			    var d=m1*m2;
			  
			    return acos(n/d);
			};
			
			var angleBetweenPointsWithNegative=function(center,p1,p2){
			    
			    //x1*y2-y1*x2,x1*x2+y1*y2
			    var x1=p1[0]-center[0];
			    var x2=p2[0]-center[0];
			    var y1=p1[1]-center[1];
			    var y2=p2[1]-center[1];
			    return atan2(x1*y2-y1*x2,x1*x2+y1*y2);
			};
			
			var dot=function(vecA,vecB){
			  return vecA[0]*vecB[0]+vecA[1]*vecB[1];  
			};
			
			var closestPointOnLine=function(linePoses,pointPos){
			//credit
			//https://monkeyproofsolutions.nl/wordpress/how-to-calculate-the-shortest-distance-between-a-point-and-a-line/
			  var m=[linePoses[0]-linePoses[2],linePoses[1]-linePoses[3]];
			  var t=dot(m, [pointPos[0] - linePoses[0],pointPos[1] - linePoses[1]]) / dot(m, m);
			  t=constrain(t,-1,0);
			  var intersectPnt =[linePoses[0] + t * m[0],linePoses[1] + t * m[1]];
			  return intersectPnt;
			    
			};
			
			var lineLineCollisions=function(x1,y1,x2,y2,x3,y3,x4,y4){
			    var den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
			    if(den===0){
			        return [false];
			    }
			    var t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/den;
			    var u=-((x1-x2)*(y1-y3)-(y1-y2)*(x1-x3))/den;
			   
			    if(t>=0&&t<=1&&u>=0&&u<=1){
			    var pt=new vectorClass();
			        pt.x=x1+t*(x2-x1);
			        pt.y=y1+t*(y2-y1);
			         strokeWeight(4);
			
			        return [true,[pt.x,pt.y]];
			    }else{
			        return [false];
			    }
			};
			
			var normalOfLine=function(l){
			    var len=dist(l[0],l[1],l[2],l[3]);
			    return [(l[1]-l[3])/len,-1*(l[0]-l[2])/len];
			};
			
			var rotateAroundPoint=function(o,p,a){
			    var s = sin(a);
			    var c = cos(a);
			    var po=[p[0]-o[0],p[1]-o[1]];
			  
			    var newP = [po[0] * c - po[1] * s,  po[0] * s + po[1] * c];
			    newP[0]+= o[0];  
			    newP[1]+= o[1];
			  return newP;
			};
			
			var rotatePointsAroundPoint=function(o,ps,a){
			    var output=[];
			    for(var i=0;i<ps.length;i++){
			        output.push(rotateAroundPoint(o,ps[i],a));
			    }
			    
			    return output;
			};
			
			var midPointOfLine=function(l){
			
			    return [(l[0]+l[2])/2,(l[1]+l[3])/2];
			};
			
			var midPointOfPoints=function(points){
			    var out=[0,0];
			    for(var i=0;i<points.length;i++){
			        out[0]+=points[i][0];
			        out[1]+=points[i][1];
			    }
			    out=[out[0]/points.length,out[1]/points.length];
			    return out;
			};
			
			var AABB=function(AA,BB){
			    /*x1,y1,x2,y2*/
			    return (AA[0]<BB[2]&&AA[2]>BB[0]&&AA[1]<BB[3]&&AA[3]>BB[1]);
			    
			};
			
			var _max=function(a,b){
			    return a<b?b:a;
			};
			
			var _min=function(a,b){
			    return a<b?a:b;
			};
			
			var randomColor=function(){
			    return color(random(0,255),random(0,255),random(0,255));
			};
			
			//}
			
			
			
			var keys=[];
			for(var i=0;i<200;i++){
			    keys.push(false);
			}
			
			
			
			
			//paths
			
			var Path=function(points,type,speed,distance,rotationOffset){
			    this.points=points;
			    this.type=type;
			    this.speed=speed;
			    this.distance=distance;
			    this.rotationOffset=rotationOffset;
			};
			Path.prototype.moveRandom=function(strength){
			  for(var i=0;i<this.points;i++){
			    var ra=random(0,360);
			    var rs=random(0,strength);
			    this.points[i][0]+=cos(ra)*rs;
			    this.points[i][1]+=sin(ra)*rs;
			    
			  
			  }  
			    
			};
			
			
			
			//softBody
			//{
			var softBody=function(points,statics,collisionLines,springs,volumeTriangles,frame,damping,springStrength,volumeStrength,frameStrength,mass,layer,objectColor){
			    
			    //set up points and velocities
			    //{
			        this.statics=statics;
			        this.totalStatic=true;
			        for(var i=0;i<this.statics.length;i++){
			            if(this.statics[i]===false){
			                this.totalStatic=false;
			            }
			        }
			        this.points=points;
			        this.pointsV=[];
			        for(var i=0;i<this.points.length;i++){
			            this.pointsV.push([0,0]);
			        }
			    //}
			    
			    //set up collision stuff
			    //{
			        this.collisionLines=collisionLines;
			        this.boundingBox=[/*x1,y1,x2,y2*/];
			        this.mass=mass;
			        this.layer=layer;
			    //}
			    
			    //set up springs
			    //{
			        this.springs=springs;
			        this.springStrength=springStrength;
			        this.lengths=[];
			        for(var i=0;i<this.springs.length;i++){
			            this.lengths.push(dist(this.points[this.springs[i][0]][0],this.points[this.springs[i][0]][1],this.points[this.springs[i][1]][0],this.points[this.springs[i][1]][1])); 
			        }
			    //}
			    
			    this.damping=damping;
			    
			    
			    //set of volume stuff
			    //{
			       this.tris=volumeTriangles;
			       this.volumeStrength=volumeStrength;
			       this.normalVolume=0;
			       for(var i=0;i<this.tris.length;i++){
			          this.normalVolume+=areaOfTriangle([
			              [this.points[this.tris[i][0]][0],this.points[this.tris[i][0]][1]],
			              [this.points[this.tris[i][1]][0],this.points[this.tris[i][1]][1]],
			              [this.points[this.tris[i][2]][0],this.points[this.tris[i][2]][1]]]);
			       }
			    //}
			    
			
			    //set of frame
			    //{
			        this.frameStrength=frameStrength;
			        this.framePoints=frame;
			        this.frame=[];
			        for(var i=0;i<frame.length;i++){
			            this.frame.push([points[frame[i]][0]+0+0*random(-50,50),points[frame[i]][1]+0+0*random(-50,50)]);
			        }
			    //}
			    
			    
			    this.rotation=0;
			    
			    this.fillColor=objectColor;
			    //this.fillColor=color(random(0,255),random(0,255),random(0,255));
			    
			    this.pathPoint=0;
			    this.pathPointV=1;
			    this.path=null;
			    
			};
			
			//returns array of fram point possitions [[x,y],[x,y]...]
			softBody.prototype.returnFramePoints=function(){
			    var output=[];
			    for(var i=0;i<this.framePoints.length;i++){
			        output.push(this.points[this.framePoints[i]]);
			    }
			    return output;
			};
			
			//recalculates the bounding box
			softBody.prototype.calculateBoundingBox=function(){
			    this.boundingBox=[Infinity,Infinity,-Infinity,-Infinity];
			
			    for(var i=0;i<this.points.length;i++){
			        this.boundingBox[0]=_min(this.boundingBox[0],this.points[i][0]);
			        this.boundingBox[1]=_min(this.boundingBox[1],this.points[i][1]);
			        this.boundingBox[2]=max(this.boundingBox[2],this.points[i][0]);
			        this.boundingBox[3]=max(this.boundingBox[3],this.points[i][1]);        
			    }
			    
			};
			
			//draw the softbody (true) with debug (false) no debug
			softBody.prototype.draw= function(drawDebug) {
			
			    //draw the collision lines (basically the shape's lines) (draws them neon like
			    //{  
			        //line one
			        strokeWeight(7);
			        stroke(this.fillColor,100);
			        for(var i=0;i<this.collisionLines.length;i++){
			        var p1=toCamPos(this.points[this.collisionLines[i][0]][0],this.points[this.collisionLines[i][0]][1]);
			        var p2=toCamPos(this.points[this.collisionLines[i][1]][0],this.points[this.collisionLines[i][1]][1]);
			      
			            line(p1[0],p1[1],p2[0],p2[1]);
			        
			        }
			        
			        
			        //line two
			        strokeWeight(15);
			        stroke(this.fillColor,100);
			        for(var i=0;i<this.collisionLines.length;i++){
			        var p1=toCamPos(this.points[this.collisionLines[i][0]][0],this.points[this.collisionLines[i][0]][1]);
			        var p2=toCamPos(this.points[this.collisionLines[i][1]][0],this.points[this.collisionLines[i][1]][1]);
			      
			            line(p1[0],p1[1],p2[0],p2[1]);
			        
			        }
			        
			        
			        //line three with points
			        strokeWeight(2);
			        stroke(255,255,255);
			        for(var i=0;i<this.collisionLines.length;i++){
			            strokeWeight(2);
			            var p1=toCamPos(this.points[this.collisionLines[i][0]][0],this.points[this.collisionLines[i][0]][1]);
			        var p2=toCamPos(this.points[this.collisionLines[i][1]][0],this.points[this.collisionLines[i][1]][1]);
			      
			            line(p1[0],p1[1],p2[0],p2[1]);
			            
			            //points
			            strokeWeight(2);
			            point(p1[0],p1[1]);
			            point(p2[0],p2[1]);
			        } 
			    
			    //}
			    
			    //fill in shape
			    if(!false){
			        fill(this.fillColor,100);
			        stroke(red(this.fillColor)*0.9,green(this.fillColor)*0.9,blue(this.fillColor)*0.9,100);
			        
			        beginShape();
			        for(var i=0;i<this.collisionLines.length;i++){
			            var p1=toCamPos(this.points[this.collisionLines[i][0]][0],this.points[this.collisionLines[i][0]][1]);
			            
			            vertex(p1[0],p1[1]);
			        }
			        
			        var p1=toCamPos(this.points[this.collisionLines[0][0]][0],this.points[this.collisionLines[0][0]][1]);
			            
			            vertex(p1[0],p1[1]);
			        endShape();
			    }
			    
			    
			    //debug stuff
			    if(drawDebug){
			        
			        //debug points with text
			        //{
			            strokeWeight(7);
			            stroke(0, 0, 0);
			            fill(0, 0, 0);
			            textSize(15);
			        
			            for(var i=0;i<this.points.length;i++){
			                var p1=toCamPos(this.points[i][0],this.points[i][1]);
			                point(p1[0],p1[1]);
			                text(i,p1[0]+5,p1[1]+5);
			            }
			        
			        //}
			        
			        //springs
			        //{
			            strokeWeight(1);
			            stroke(84, 199, 95);
			        for(var i=0;i<this.springs.length;i++){
			            var p1=toCamPos(this.points[this.springs[i][0]][0],this.points[this.springs[i][0]][1]);
			            var p2=toCamPos(this.points[this.springs[i][1]][0],this.points[this.springs[i][1]][1]);
			            line(p1[0],p1[1],p2[0],p2[1]);
			            }
			        //}
			    
			        //mid point of shape and rotation
			        //{
			            strokeWeight(1);
			            stroke(255, 0, 38);
			            var midPointOfObject=midPointOfPoints(this.points);
			            var correctMidPoint=toCamPos(midPointOfObject[0],midPointOfObject[1]);
			            point(correctMidPoint[0],correctMidPoint[1]);
			          
			            line(correctMidPoint[0],correctMidPoint[1],
			            correctMidPoint[0]+cos(this.rotation)*10,correctMidPoint[1]+sin(this.rotation)*10);
			        //}
			    
			        //bounding box
			        //{
			            noFill();
			            stroke(0, 0, 0);
			            strokeWeight(1);
			            var correctBoundingBox1=toCamPos(this.boundingBox[0],this.boundingBox[1]);
			            var correctBoundingBox2=toCamPos(this.boundingBox[2],this.boundingBox[3]);
			            rect(correctBoundingBox1[0],correctBoundingBox1[1],correctBoundingBox2[0]-correctBoundingBox1[0],correctBoundingBox2[1]-correctBoundingBox1[1]);
			        //}
			    
			        //frame
			        //{
			            strokeWeight(1);
			            stroke(255, 0, 255);
			            //println(this.frame.length);
			            for(var i=0;i<this.frame.length;i++){
			                var p1=toCamPos(this.frame[i][0],this.frame[i][1]);
			                var p2=toCamPos(this.frame[(i+1)%this.frame.length][0],this.frame[(i+1)%this.frame.length][1]);
			                line(p1[0],p1[1],p2[0],p2[1]);
			            }
			        //}
			    
			        //volume triangles
			        //{
			            strokeWeight(1);
			            stroke(0, 119, 255);
			            fill(255, 255, 255,100);
			            for(var i=0;i<this.tris.length;i++){
			                var p1=toCamPos(this.points[this.tris[i][0]][0],this.points[this.tris[i][0]][1]);
			                var p2=toCamPos(this.points[this.tris[i][1]][0],this.points[this.tris[i][1]][1]);
			                var p3=toCamPos(this.points[this.tris[i][2]][0],this.points[this.tris[i][2]][1]);
			                
			                triangle(p1[0],p1[1],p2[0],p2[1],p3[0],p3[1]);
			                /*
			                triangle(this.points[this.tris[i][0]][0]-cam[0],this.points[this.tris[i][0]][1]-cam[1],
			                    this.points[this.tris[i][1]][0]-cam[0],this.points[this.tris[i][1]][1]-cam[1],
			                    this.points[this.tris[i][2]][0]-cam[0],this.points[this.tris[i][2]][1]-cam[1] );*/
			            }
			        //}
			        
			        
			        //path points
			        //{
			        if(this.path!==null){
			        strokeWeight(10);
			        stroke(251, 255, 0);
			            for(var i=0;i<this.path.points.length-1;i++){
			                var correctPos1=toCamPos(this.path.points[i][0],this.path.points[i][1]);
			                var correctPos2=toCamPos(this.path.points[i+1][0],this.path.points[i+1][1]);
			                //point(correctPos[0],correctPos[1]);
			                line(correctPos1[0],correctPos1[1],correctPos2[0],correctPos2[1]);
			                
			                
			            }
			            }
			        //}
			    }
			    
			    
			};
			
			//moves midpoint of frame to pos. Pos should be [x,y]
			softBody.prototype.moveFrame=function(pos){
			    var midPointOfFrame=midPointOfPoints(this.frame);
			    var offset=[pos[0]-midPointOfFrame[0],pos[1]-midPointOfFrame[1]];
			    for(var i=0;i<this.frame.length;i++){
			         this.frame[i][0]+=offset[0];
			         this.frame[i][1]+=offset[1];
			    }
			};
			
			//rotate frame by angle
			softBody.prototype.rotateFrame=function(angle){
			    this.rotation+=angle;
			    var midPointOfFrame=midPointOfPoints(this.frame);
			    this.frame=rotatePointsAroundPoint(midPointOfFrame,this.frame,angle);
			};
			
			//setFrame will move and rotate the frame to the points of the softbody.
			softBody.prototype.setFrame=function(){
			   for(var c=0;c<10;c++){
			    var midPointOfFrame=midPointOfPoints(this.frame);
			    this.moveFrame(midPointOfPoints(this.returnFramePoints()));
			    
			    var averageAngle=0;
			    for(var i=0;i<this.framePoints.length;i++){
			        averageAngle+=angleBetweenPointsWithNegative(midPointOfFrame,this.frame[i],this.points[this.framePoints[i]]);
			    }
			    
			    averageAngle/=this.points.length;
			
			    this.rotateFrame(averageAngle);
			    
			   }
			};
			
			//will try to put the points back to the frame
			softBody.prototype.addFrameForces=function(){
			    for(var i=0;i<this.framePoints.length;i++){
			        var l=dist(this.points[this.framePoints[i]][0],this.points[this.framePoints[i]][1],
			                        this.frame[i][0],this.frame[i][1]);
			        var changeAmount=this.frameStrength*(-l);
			            var vector=new vectorClass(this.points[this.framePoints[i]][0]-this.frame[i][0],
			                                        this.points[this.framePoints[i]][1]-this.frame[i][1]);
			                      
			        vector.normalize();
			        vector.x*=changeAmount;
			        vector.y*=changeAmount;
			        this.pointsV[this.framePoints[i]][0]+=vector.x;
			        this.pointsV[this.framePoints[i]][1]+=vector.y;
			    
			    }
			    
			    
			};
			
			//updates points position based off of velocity and adds damping
			softBody.prototype.simulate=function(){
			    for(var i=0;i<this.points.length;i++){
			        if(!this.statics[i]){
			        this.points[i][0]+=this.pointsV[i][0];
			        this.points[i][1]+=this.pointsV[i][1];
			
			        
			        
			        this.pointsV[i][0]*=this.damping;
			        this.pointsV[i][1]*=this.damping;}
			    }
			    
			};
			
			//adds force to all points velocity force=[xForce,yForce]
			softBody.prototype.addForce=function(force){
			    for(var i=0;i<this.pointsV.length;i++){
			        this.pointsV[i][0]+=force[0];
			        this.pointsV[i][1]+=force[1];
			        
			    }
			};
			
			//simulates springs
			softBody.prototype.springConstraint=function(){
			    for(var c=0;c<this.springs.length;c++){
			        var i=this.springs[c][0];
			        var i2=this.springs[c][1];
			        
			        var l=dist(this.points[i][0],this.points[i][1],
			                        this.points[i2][0],this.points[i2][1]);
			       
			        var changeAmount=this.springStrength*(this.lengths[c]-l);
			                    
			        var vector=new vectorClass(this.points[i][0]-this.points[i2][0],
			                                        this.points[i][1]-this.points[i2][1]);
			        vector.normalize();
			        
			        vector.x*=changeAmount;
			        vector.y*=changeAmount;
			       
			        this.pointsV[i][0]+=vector.x;
			        this.pointsV[i][1]+=vector.y;
			        
			        this.pointsV[i2][0]-=vector.x;
			        this.pointsV[i2][1]-=vector.y;
			    
			    }
			};
			
			//simulates volume
			softBody.prototype.volumeConstraint=function(){
			    var currentVolume=0;
			    
			    //calculate Volume
			    //{
			        for(var i=0;i<this.tris.length;i++){
			           currentVolume+=areaOfTriangle([
			               [this.points[this.tris[i][0]][0],this.points[this.tris[i][0]][1]],
			               [this.points[this.tris[i][1]][0],this.points[this.tris[i][1]][1]],
			               [this.points[this.tris[i][2]][0],this.points[this.tris[i][2]][1]]]);
			        }
			    //}
			    currentVolume*=1/pressure;
			    //move based off of volume
			    if(currentVolume!==0){
			    for(var i=0;i<this.collisionLines.length;i++){
			      var normalDirection=normalOfLine([this.points[this.collisionLines[i][0]][0],this.points[this.collisionLines[i][0]][1],this.points[this.collisionLines[i][1]][0],this.points[this.collisionLines[i][1]][1]]);
			      normalDirection[0]*=-1;
			      normalDirection[1]*=-1;
			      
			      var mid=midPointOfLine([this.points[this.collisionLines[i][0]][0],this.points[this.collisionLines[i][0]][1],this.points[this.collisionLines[i][1]][0],this.points[this.collisionLines[i][1]][1]]);
			      stroke(255, 0, 0);
			      strokeWeight(5);
			      var normalPoint1=toCamPos(mid[0],mid[1]);
			      var normalPoint2=toCamPos(mid[0]+normalDirection[0]*(this.normalVolume/currentVolume-1)*this.volumeStrength*200,mid[1]+normalDirection[1]*(this.normalVolume/currentVolume-1)*this.volumeStrength*200);
			     // line(mid[0],mid[1],mid[0]+normalDirection[0]*(this.normalVolume/currentVolume-1)*this.volumeStrength*100,mid[1]+normalDirection[1]*(this.normalVolume/currentVolume-1)*this.volumeStrength*100);
			     // line(normalPoint1[0],normalPoint1[1],normalPoint2[0],normalPoint2[1]);
			       this.pointsV[this.collisionLines[i][0]][0]+=normalDirection[0]*(this.normalVolume/currentVolume-1)*this.volumeStrength;
			       this.pointsV[this.collisionLines[i][0]][1]+=normalDirection[1]*(this.normalVolume/currentVolume-1)*this.volumeStrength;
			       this.pointsV[this.collisionLines[i][1]][0]+=normalDirection[0]*(this.normalVolume/currentVolume-1)*this.volumeStrength;
			       this.pointsV[this.collisionLines[i][1]][1]+=normalDirection[1]*(this.normalVolume/currentVolume-1)*this.volumeStrength;
			        
			    }
			    }
			};

			//returns closest Point and the line the points is on [outPoint,minDistI]
			softBody.prototype.closestPointLine=function(point){
			    //closestPointOnLine (linePoses,pointPos)
			     var minDist=Infinity;
			     var minDistI=0;
			     var outPoint=[];
			     for(var i=0;i<this.collisionLines.length;i++){
			         var d=closestPointOnLine(
			[this.points[this.collisionLines[i][0]][0],this.points[this.collisionLines[i][0]][1],  
			this.points[this.collisionLines[i][1]][0],this.points[this.collisionLines[i][1]][1]],point);
			        var distance=dist(point[0],point[1],d[0],d[1]);
			        if(distance<minDist){
			             minDist=distance;
			             minDistI=i;
			             outPoint=d;
			        }
			     }
			     return [outPoint,minDistI];
			};
			
			//will detect collisions then update the softbodies
			softBody.prototype.resolveCollisions=function(otherBody){
			    //Idea to fix collisions. If both line points are static then move this point by full amount. If this point is static then fully move the lines
			    
			    
			    //checks to see if the two bounding boxes collide if so then we can continue
			    //also checks to see if they share the same layer. If so then they cant collide
			    if(AABB(this.boundingBox,otherBody.boundingBox)&&this.layer!==otherBody.layer&&!(this.totalStatic&&otherBody.totalStatic)){
			        
			        //updates the total checks variable so we can see how many collisions are happening
			        totalChecks++;
			        
			        //checks all the points of this softbody to see if they are in the other softbody
			        for(var i=0;i<this.framePoints.length;i++){
			            
			            //if the point is inside of the other softbody then we need to resolve this
			            if(otherBody.insideObject(this.points[this.framePoints[i]])){
			                
			                //debug point (point that is insde other shape)
			                //{
			                    stroke(255, 0, 0);
			                    strokeWeight(10);
			                    //point(this.points[i][0]-cam[0],this.points[i][1]-cam[1]);
			                //}
			                
			                var closestPointLine=otherBody.closestPointLine(this.points[this.framePoints[i]]);
			               
			               //debug point for closest point
			                //{
			                    stroke(55, 0, 255);
			                    strokeWeight(10);
			                    // point(closestPointLine[0][0]-cam[0],closestPointLine[0][1]-cam[1]);
			                //}
			               
			                var dir=[this.points[this.framePoints[i]][0]-closestPointLine[0][0],this.points[this.framePoints[i]][1]-closestPointLine[0][1]];
			                
			                var totalMass=this.mass+otherBody.mass;
			                var shiftAmount=1-this.mass/totalMass;
			                var otherPoints=otherBody.collisionLines[closestPointLine[1]];
			                
			                if((otherBody.statics[otherPoints[0]]&&otherBody.statics[otherPoints[1]])){
			                    shiftAmount=1;
			                }
			                //shiftAmount/=2;
			                //resolves this point
			                if(!this.statics[this.framePoints[i]]){
			                    this.points[this.framePoints[i]][0]-=dir[0]*shiftAmount;
			                    this.points[this.framePoints[i]][1]-=dir[1]*shiftAmount;
			                    this.pointsV[this.framePoints[i]][0]-=dir[0]*shiftAmount;
			                    this.pointsV[this.framePoints[i]][1]-=dir[1]*shiftAmount;
			                }
			                
			                //resolve the other object's line
			                var shiftAmount=1-otherBody.mass/totalMass;
			                if(this.statics[this.framePoints[i]]){
			                    shiftAmount=1;
			                }
			                //shiftAmount/=2;
			                if(!otherBody.statics[otherPoints[0]]){
			                    otherBody.points[otherPoints[0]][0]+=dir[0]*shiftAmount;
			                    otherBody.points[otherPoints[0]][1]+=dir[1]*shiftAmount;
			                    
			                    otherBody.pointsV[otherPoints[0]][0]+=dir[0]*shiftAmount/2;
			                    otherBody.pointsV[otherPoints[0]][1]+=dir[1]*shiftAmount/2;
			                }
			                
			                if(!otherBody.statics[otherPoints[1]]){
			                    otherBody.points[otherPoints[1]][0]+=dir[0]*shiftAmount;
			                    otherBody.points[otherPoints[1]][1]+=dir[1]*shiftAmount;
			                    
			                    otherBody.pointsV[otherPoints[1]][0]+=dir[0]*shiftAmount/2;
			                    otherBody.pointsV[otherPoints[1]][1]+=dir[1]*shiftAmount/2;
			                }
			                
			                
			                //debug line that would show which lines are moving
			               // {
			                stroke(0, 255, 77);
			               /* line(
			                otherBody.points[otherPoints[0]][0],otherBody.points[otherPoints[0]][1],
			                otherBody.points[otherPoints[1]][0],otherBody.points[otherPoints[1]][1]);
			                */
			                //}
			            }
			        
			        
			        
			        }
			        
			    }
			    
			};
			
			//updates the softbody does all the physics stuff but collisions
			softBody.prototype.update=function(rotate,move){
			  
			   // this.addForce([0,1]);
			    this.simulate();
			    this.calculateBoundingBox();
			    this.setFrame();
			    this.springConstraint();
			    this.volumeConstraint();
			     if((keys[65]*1-keys[68]*1)+""!=="NaN"){
			        this.rotateFrame((keys[68]*5-keys[65]*5)*rotate);
			    }
			   
			    if((keys[RIGHT]*1-keys[LEFT]*1)+""!=="NaN"){
			        this.addForce([(keys[RIGHT]-keys[LEFT])*move,(keys[UP]-keys[DOWN])*move*-1]);
			       
			    }
			    this.addFrameForces();
			    this.followPath();
			};
			
			//returns forward vector normalized [x,y]
			softBody.prototype.forward=function(){ 
			    return [cos(this.rotation),sin(this.rotation)];
			};
			
			//returns right vector normalized [x,y] basically forward vector rotated 90 degrees.
			softBody.prototype.right=function(){ 
			    return [cos(this.rotation+90),sin(this.rotation+90)];
			};
			
			softBody.prototype.averageVelocity=function(){
			    var x=0;
			    var y=0;
			    for(var i=0;i<this.pointsV.length;i++){
			        x+=this.pointsV[i][0];
			        y+=this.pointsV[i][1];
			    }
			    return [x/this.pointsV.length,y/this.pointsV.length];
			};
			
			softBody.prototype.setPath=function(newPath){
			    this.path=newPath;
			};
			
			softBody.prototype.followPath=function(){
			    if(this.path!==null){
			        var targetPoint=[this.path.points[this.pathPoint][0]+0,this.path.points[this.pathPoint][1]+0];
			        var currentMidPos=midPointOfPoints(this.points);
			        
			        targetPoint[0]-=currentMidPos[0];
			        targetPoint[1]-=currentMidPos[1];
			        
			        var dir= new vectorClass(targetPoint[0],targetPoint[1]);
			        dir.normalize();
			        dir.mult(this.path.speed);
			        
			        this.addForce([dir.x,dir.y]);
			        
			        
			        var midPointOfFrame=midPointOfPoints(this.frame);
			        var rotationAngle=angleBetweenPointsWithNegative(midPointOfFrame,[midPointOfFrame[0]+cos(this.rotation),midPointOfFrame[1]+sin(this.rotation)],[this.path.points[this.pathPoint][0]+0,this.path.points[this.pathPoint][1]+0]);
			        rotationAngle+=this.path.rotationOffset;
			        this.rotateFrame(rotationAngle/5);
			        this.addFrameForces();
			        
			        if(dist(targetPoint[0],targetPoint[1],0,0)<this.path.distance){
			            this.pathPoint+=this.pathPointV;
			            if(this.pathPoint>=this.path.points.length){
			                if(this.path.type==="circle"){
			                    this.pathPoint=0;
			                    this.pathPointV=1;
			                }else if(this.path.type==="bounce"){
			                    
			                    this.pathPoint=this.path.points.length-2;
			                    this.pathPointV=-1;
			                }
			            }
			            if(this.pathPoint<0){
			                if(this.path.type==="circle"){
			                    this.pathPoint=0;
			                    this.pathPointV=1;
			                }else if(this.path.type==="bounce"){
			                    
			                    this.pathPoint=1;
			                    this.pathPointV=1;
			                }
			            }
			        }
			    }
			};

			};
			
			particle.prototype.update=function(){
