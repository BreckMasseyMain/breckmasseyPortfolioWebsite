			            if(worldMap[basePos[0]+basePos[1]*worldSize[0]]===waterBlocks[c]){
			                hitWater=true;
			            }
			    }    
			    for(var c=0;c<spikes.length;c++){
			            if(worldMap[basePos[0]+basePos[1]*worldSize[0]]===spikes[c]){
			       this.pos.x=this.checkPoint.x;
			       this.pos.y=this.checkPoint.y;
			            }
			    }
			    if(!transparent){
			        var col=collision(this.pos.x/8,this.pos.y/8,basePos[0],basePos[1]);
			        this.pos.x=col[0]*8;
			        this.pos.y=col[1]*8;
			        this.vel.x=(this.vel.x)*col[2];
			        this.vel.y=(this.vel.y)*col[3];
			        if(col[4]){
			            this.grounded=true;
			        }
			    }
			    
			    
			    
			    basePos=[floor(this.pos.x/8)+1,floor(this.pos.y/8)+1];
			    transparent=false;
			    for(var c=0;c<transparentBlocks.length;c++){
			            if(worldMap[basePos[0]+basePos[1]*worldSize[0]]===transparentBlocks[c]){
			                transparent=true;
			            }
			    }
			    for(var c=0;c<waterBlocks.length;c++){
			            if(worldMap[basePos[0]+basePos[1]*worldSize[0]]===waterBlocks[c]){
			                hitWater=true;
			            }
			    }    
			    for(var c=0;c<spikes.length;c++){
			            if(worldMap[basePos[0]+basePos[1]*worldSize[0]]===spikes[c]){
			       this.pos.x=this.checkPoint.x;
			       this.pos.y=this.checkPoint.y;
			            }
			    }
			    if(!transparent){
			        var col=collision(this.pos.x/8,this.pos.y/8,basePos[0],basePos[1]);
			        this.pos.x=col[0]*8;
			        this.pos.y=col[1]*8;
			        this.vel.x=(this.vel.x)*col[2];
			        this.vel.y=(this.vel.y)*col[3];
			        if(col[4]){
			            this.grounded=true;
			        }        
			    }
			    if(hitWater){
			        this.vel.add(new vec(0,-0.004));
			        this.vel.x=constrain(this.vel.x,-0.1,0.1);
			        this.vel.y=constrain(this.vel.y,-0.1,0.1);
			            this.grounded=true;
			    }
			    
			    
			    
			    
			    }
			};
			
			var player=new Player(startPos[0]*8,startPos[1]*8);
			draw= function() {
			    //println(keyCode);
			    background(255,255,255);
			    drawWorldMap(cam.x,cam.y);
			    
			    var midX=80;
			    if(player.pos.x-midX>cam.x){
			        cam.x++;
			    }
			    if(player.pos.x-midX<cam.x){
			        cam.x--;
			    } 
			    var midY=80;
			    if(player.pos.y-midY>cam.y){
			        cam.y++;
			    }
			    if(player.pos.y-midY<cam.y){
			        cam.y--;
			    }
			    cam.x=constrain(cam.x,0,160);
			    cam.y=constrain(cam.y,0,75);
			    player.draw();
			  //  player.updatePhysics();
			    player.collisions();
			   // println(keyCode);
			};
			
			
			keyReleased=function(){
			    keys[keyCode]=false;
			};
			keyPressed=function(){
			    keys[keyCode]=true;
			};
			
		}
		
		runPJS(program);
		
	</script>
